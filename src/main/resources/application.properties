# Необязательный путь к JSON-файлу со списком поставщиков,
# который загружается при старте приложения.
# providers.file=providers.example.json

# Таймауты HTTP-клиента. Без них зависший поставщик заставит вызов ждать бесконечно.
# Свойства Spring Boot 4.x (в 3.x они назывались spring.http.client.*).
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

# Явно выбираем JDK HttpClient: он входит в Java 17, не требует дополнительных
# зависимостей и поддерживает и connect-, и read-таймаут.
spring.http.clients.imperative.factory=jdk
